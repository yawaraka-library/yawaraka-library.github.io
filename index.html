/* A1ゴシック: local install first, else a subset of only the glyphs this page uses */
@font-face{font-family:"YJ-JP";src:local("PA1GothicStdN-Medium"),local("A P-OTF A1ゴシック StdN M");font-weight:100 900;unicode-range:U+3000-30FF,U+3400-4DBF,U+4E00-9FFF,U+FF00-FFEF}
/* Layout: record-shop crate index. Masthead + sticky search, then a sleeve grid; search flips the grid into a track ledger. */
:root{
/* always dark: the site keeps one look whatever the phone setting */
  --bg:#0B1414; --surface:#122020; --ink:#E1ECEA; --muted:#8CA19F; --line:#233534;
  --accent:#6CB9BD; --accent-ink:#0B1414; --tone2:#2E6A6E; --tone3:#C49A50; --tone4:#9CCFD1; --mark:#1D4446; --brass:#D4A85C;
  color-scheme:dark;
  --f-display:"Big Shoulders Display","YJ-JP","Zen Kaku Gothic New","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans KR","YJ-JP","Zen Kaku Gothic New","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:4px;
}


*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{position:relative;padding-block:36px 26px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.mast .cham{width:118px}
.mast-txt{min-width:0;position:relative;z-index:1}
.mast h1 .wordmark{display:block;width:clamp(240px,42vw,500px);height:auto}
.mast-lp{position:absolute;right:150px;top:68px;width:88px}
.mast-plant{position:absolute;right:0;top:52px;width:140px}
.lang{grid-column:1/-1;grid-row:1;justify-self:end;position:relative;z-index:3;background:var(--surface);margin-bottom:-6px}
.lang button{padding:3px 9px;font-size:11.5px}

.mast h1{margin:0;display:flex;flex-direction:column;gap:2px}
.mast h1 .lib{font-family:"Fraunces","Cooper Black","Georgia",serif;font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;font-size:clamp(34px,5.4vw,62px);line-height:.95;letter-spacing:.005em;color:#7FC589;-webkit-text-stroke:5px #2B3231;paint-order:stroke fill;padding-left:6px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--ink);font-weight:500}
.meta .since{letter-spacing:.06em}
.meta .dplus{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;letter-spacing:.04em}

/* search */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--radius);padding:0 14px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 17px var(--f-body);padding:13px 0;outline:none}
.search input::placeholder{color:var(--muted);font-weight:400}
.clear{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools .lbl{font-size:12px;color:var(--muted);margin-left:auto}

/* frequent artists */
.freq{padding-block:26px 6px}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 40px}
.rank{min-width:0}
.rank h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;letter-spacing:.01em;margin:0 0 8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.rank ol{list-style:none;margin:0;padding:0}
.rank ol.two{columns:2;column-gap:24px}
.rank li{break-inside:avoid}
.rank li button{all:unset;cursor:pointer;display:grid;grid-template-columns:3ch 1fr auto;gap:8px;align-items:baseline;width:100%;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rank li button:hover .nm,.rank li button:focus-visible .nm{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.rank .rk{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.rank li:nth-child(-n+3) .rk{color:var(--brass);font-weight:500}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .ct{font-family:var(--f-mono);font-size:12px;color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.more:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:560px){.rank ol{columns:1}}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--brass)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px;padding-block:8px 20px}
#grid{padding-block:6px 48px}
.shelf{position:relative;display:flex;align-items:flex-end;gap:14px;padding-block:34px 14px;border-bottom:1.5px solid var(--ink);margin-bottom:18px}
.shelf h2{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,52px);line-height:.85;text-transform:uppercase;margin:0}
.shelf .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-bottom:4px}
.shelf .sts{margin-left:auto;display:flex;align-items:flex-end;gap:6px;margin-bottom:-10px}
.shelf .st{width:84px}
.shelf .st.big{width:120px}
/* stickers */
.st{display:block;height:auto;max-width:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));pointer-events:none;user-select:none}
.js .pop{opacity:0;transform:translateY(14px) scale(.4) rotate(-14deg)}
.js .pop.in{animation:pop .7s cubic-bezier(.34,1.56,.64,1) var(--d,0s) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.4) rotate(-14deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.spin.in{animation:pop .7s cubic-bezier(.34,1.56,.64,1) var(--d,0s) forwards,spin 6s linear calc(var(--d,0s) + .7s) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wiggle.in{animation:pop .7s cubic-bezier(.34,1.56,.64,1) var(--d,0s) forwards,wig 3.2s ease-in-out calc(var(--d,0s) + 1s) infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-7deg)}20%{transform:rotate(5deg)}30%{transform:rotate(0)}}
.foot-st{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.foot-st .st{width:90px}.foot-st .st.wm{width:220px;filter:none;margin-left:auto}
.empty .st{width:110px;margin-bottom:10px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.sleeve{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:var(--accent);max-width:100%}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}

.no{position:absolute;left:10px;bottom:8px;z-index:2;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.card h3{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1;text-transform:uppercase;margin:0;text-wrap:balance}
.card .sub{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.card .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px;font-variant-numeric:tabular-nums}

/* results ledger */
.results{padding-block:20px 64px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.rhead h2{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;margin:0}
.rhead p{margin:0;color:var(--muted);font-size:14px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.ledger{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.ledger li{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mini{width:72px;aspect-ratio:16/9;border-radius:3px;overflow:hidden;background:var(--accent);position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent-ink);font-size:20px}
.ledger .t{min-width:0}
.ledger .song{font-weight:600;font-size:15px}
.ledger .art{color:var(--muted);font-size:13.5px}
.ledger .from{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.linkish{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
.linkish:hover{text-decoration-color:currentColor}
a.ts.play{text-decoration:none;border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:999px;padding:1px 8px;align-self:start;justify-self:start;line-height:1.5}
a.ts.play:hover,a.ts.play:focus-visible{background:var(--brass);color:var(--bg)}
.ts{font-family:var(--f-mono);font-size:12.5px;color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:48px 0;color:var(--muted)}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 32px);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,14,14,.6)}
.dhero{position:relative;aspect-ratio:16/9;background:var(--accent);overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover;display:block}
.dhero .blank{position:absolute;inset:0;display:grid;place-items:center}

let LANG = 'ja';
try{ const s=localStorage.getItem('yjc-lang'); if(s==='ja'||s==='en') LANG=s; }catch(e){}
const T = k => I18N[LANG][k];
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.getElementById('q').placeholder = T('ph');
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===LANG));
}


// thumbnail: embedded frame, else YouTube id (works when hosted outside the artifact), else logo sleeve
function thumbSrc(s){ return THUMBS[s.n] || (s.yt ? `https://i.ytimg.com/vi/${s.yt}/maxresdefault.jpg` : null); }
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/ø/g,'o').replace(/æ/g,'ae').replace(/[’'"`.]/g,'').replace(/\s+/g,' ').trim();
const shortName = t => t.replace(/\s*(Jazz\s+)?Vinyl Set$/i,'').replace(/\s+Jazz$/i,'') || t;
const fmtDate = d => d.replaceAll('-','.');

// artist splitting for frequency counts
const ALIAS = {"the modern jazz quartet":"Modern Jazz Quartet","modern jazz quartet":"Modern Jazz Quartet","the bill evans trio":"Bill Evans","getz & gilberto":"Stan Getz"};
function people(a){
  if(!a) return [];
  const al = ALIAS[a.toLowerCase()]; if(al) return [al];
  return a.split(/\s*(?:,|&|\/|\band\b|\bwith\b|\bfeat\.|\bft\.|\bfeaturing\b)\s*/i)
    .map(x=>x.trim()).filter(Boolean)
    .map(x=>{ const k=ALIAS[x.toLowerCase()]; if(k) return k;
      if(/^(his|the) (jazz groups|famous orchestra|orchestra|jazz messengers|candela allstars)/i.test(x)) return null;
      return x.replace(/\s+(Trio|Quartet|Quintet|Sextet|Group|Orchestra|Percussion Ensemble)$/i,'').replace(/^The\s+(?=\w+\s+\w+)/,'');
    }).filter(x=>x && x.length>1 && !/^(Count Basie And His)$/i.test(x));
}

const ALL = [];
SETS.forEach(s => s.tracks.forEach(([ts,song,artist],i) => ALL.push({s,ts,song,artist,i,ns:norm(song),na:norm(artist),nset:norm(s.title+" "+(s.name||""))})));

const counts = new Map();
SETS.forEach(s => { const seen=new Set(); s.tracks.forEach(t=>people(t[2]).forEach(p=>{
  const k=p; const c=counts.get(k)||{tracks:0,sets:new Set()}; c.tracks++; c.sets.add(s.n); counts.set(k,c); })); });

// meta line
const dates = SETS.map(s=>s.date).sort();
const dPlus = Math.floor((Date.now() - new Date(dates[0]+'T00:00:00+09:00')) / 86400000);
document.getElementById('meta').innerHTML =
  `<span><b>${SETS.length}</b> sets</span><span><b>${ALL.filter(t=>t.artist).length}</b> tracks</span><span><b>${counts.size}</b> artists</span><span class="since">Since ${fmtDate(dates[0])} <b class="dplus">D+${dPlus}</b></span>`;
document.getElementById('upd').textContent = fmtDate(UPDATED);

// frequent chips
const songKey = s => norm(s.replace(/\s*[\(（].*?[\)）]/g,'')).replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const songCounts = new Map();
ALL.forEach(r=>{ if(!r.artist) return; const k=songKey(r.song); if(!k) return;
  const c=songCounts.get(k)||{name:r.song.replace(/\s*[\(（].*?[\)）]/g,'').trim(),n:0,sets:new Set()}; c.n++; c.sets.add(r.s.n); songCounts.set(k,c); });
const rankA = [...counts.entries()].sort((a,b)=>b[1].tracks-a[1].tracks||a[0].localeCompare(b[0])).map(([n,c])=>({name:n,n:c.tracks}));
const rankS = [...songCounts.values()].filter(c=>c.n>1).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
const open={A:false,S:false};
function renderRanks(){
  $('rankA').classList.toggle('two',open.A); $('rankS').classList.toggle('two',open.S);
  const row=(x,i,scope)=>`<li><button type="button" data-q="${esc(x.name)}" data-scope="${scope}"><span class="rk">${i+1}.</span><span class="nm">${esc(x.name)}</span><span class="ct">${x.n}${T('times')}</span></button></li>`;
  $('rankA').innerHTML = rankA.slice(0,open.A?30:5).map((x,i)=>row(x,i,'artist')).join('');
  $('rankS').innerHTML = rankS.slice(0,open.S?30:5).map((x,i)=>row(x,i,'song')).join('');
  $('moreA').textContent = open.A?T('less'):T('more'); $('moreS').textContent = open.S?T('less'):T('more');
}

const state = {q:'', scope:'all', sort:'new'};
const $ = id => document.getElementById(id);

function sleeve(s, cls='sleeve'){
  const src = thumbSrc(s);
  return src
    ? `<div class="${cls}"><img src="${src}" alt="" loading="lazy" onerror="if(!this.dataset.f&&this.src.includes('maxres')){this.dataset.f=1;this.src=this.src.replace('maxresdefault','hqdefault');return;}this.parentNode.classList.add('noimg');this.outerHTML='<div class=blank><i></i></div>'"></div>`
    : `<div class="${cls} noimg" style="background:${TONES[s.n%4]}"><div class="blank"><i></i></div>${cls==='sleeve'?`<span class="no">${s.n}</span>`:''}</div>`;
}
// episode numbers: oldest set = No.1, so new uploads just get the next number
const EP = new Map([...SETS].sort((a,b)=>a.date.localeCompare(b.date)).map((s,i)=>[s.n,i+1]));
const toSec = ts => ts.split(':').reduce((a,v)=>a*60+(+v),0);
const tsLink = (s,ts) => s.yt
  ? `<a class="ts play" href="https://www.youtube.com/watch?v=${s.yt}&t=${toSec(ts)}s" target="_blank" rel="noopener" title="${T('playFrom')}">▶ ${ts}</a>`
  : `<span class="ts">${ts}</span>`;
const TONES=['var(--accent)','var(--tone2)','var(--tone3)','var(--tone4)'];
const ordered = () => [...SETS].sort((a,b)=> state.sort==='new' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));

function season(d){
  const y=+d.slice(0,4), m=+d.slice(5,7);
  if(m>=3&&m<=5) return {k:`${y}-1`,y,s:'spring'};
  if(m>=6&&m<=8) return {k:`${y}-2`,y,s:'summer'};
  if(m>=9&&m<=11) return {k:`${y}-3`,y,s:'autumn'};
  const wy = m===12 ? y : y-1; return {k:`${wy}-4`,y:wy,s:'winter'};
}
const SEASON = {ja:{spring:'春',summer:'夏',autumn:'秋',winter:'冬'},en:{spring:'Spring',summer:'Summer',autumn:'Autumn',winter:'Winter'}};
const seasonLabel = g => LANG==='ja'
  ? (g.s==='winter' ? `${g.y}–${String(g.y+1).slice(2)} ${SEASON.ja.winter}` : `${g.y} ${SEASON.ja[g.s]}`)
  : (g.s==='winter' ? `${SEASON.en.winter} ${g.y}–${String(g.y+1).slice(2)}` : `${SEASON.en[g.s]} ${g.y}`);
const SHELF_ST = [['turntable','lp'],['plant','headphones'],['speaker','cup'],['clock','mixer'],['lamp','chameleon'],['lp','speaker'],['headphones','turntable']];
const stImg = (name,i,big) => `<img class="st pop${name==='lp'?' spin':''}${name==='chameleon'?' wiggle':''}${big?' big':''}" src="${STICKERS[name]}" alt="" aria-hidden="true" style="--d:${(i*.14).toFixed(2)}s">`;

function renderGrid(){
  const groups=[];
  ordered().forEach(s=>{ const g=season(s.date); const last=groups.at(-1);
    if(last && last.k===g.k) last.sets.push(s); else groups.push({...g,sets:[s]}); });
  $('grid').innerHTML = groups.map((g,gi)=>{ const pair=SHELF_ST[gi%SHELF_ST.length];
    return `<div class="shelf"><h2>${seasonLabel(g)}</h2><span class="cnt">${g.sets.length} sets</span>
      <div class="sts">${stImg(pair[0],0,true)}${stImg(pair[1],1,false)}</div></div>
    <div class="grid">${g.sets.map(s=>`
    <button class="card" type="button" data-set="${s.n}" aria-label="${esc(s.title)}">
      ${sleeve(s)}
      <div><h3>${esc((s.name||shortName(s.title)))}</h3><p class="sub">${esc(s.sub)}</p></div>
      <div class="row"><span>No.${EP.get(s.n)} · ${fmtDate(s.date)}</span><span>${s.min}min · ${s.tracks.filter(t=>t[2]).length} tracks</span></div>
    </button>`).join('')}</div>`; }).join('');
  watchPops();
}

// pop-in when scrolled into view
document.documentElement.classList.add('js');
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{rootMargin:'0px 0px -8% 0px'}) : null;
function watchPops(){ document.querySelectorAll('.pop:not(.in)').forEach(el=> io ? io.observe(el) : el.classList.add('in')); }

function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function renderResults(){
  const raw = state.q.trim(), q = norm(raw);
  const terms = q.split(' ').filter(Boolean);
  const hit = t => terms.every(w => state.scope==='artist' ? t.na.includes(w)
                                   : state.scope==='song' ? t.ns.includes(w)
                                   : (t.na.includes(w)||t.ns.includes(w)||t.nset.includes(w)));
  let rows = ALL.filter(t=>hit(t));
  rows.sort((a,b)=> state.sort==='new' ? b.s.date.localeCompare(a.s.date)||a.i-b.i : a.s.date.localeCompare(b.s.date)||a.i-b.i);
  const setCount = new Set(rows.map(r=>r.s.n)).size;
  // matched artists summary
  const who = new Map();
  rows.forEach(r=>people(r.artist).forEach(p=>{ if(terms.every(w=>norm(p).includes(w))) who.set(p,(who.get(p)||0)+1); }));
  const whoHtml = [...who.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12)
    .map(([n,c])=>`<button class="chip" type="button" data-q="${esc(n)}">${esc(n)}<i>${c}</i></button>`).join('');
  $('results').innerHTML = `
    <div class="rhead"><h2>“${esc(raw)}”</h2><p>${T("count")(rows.length,setCount)}</p></div>
    ${whoHtml?`<div class="who">${whoHtml}</div>`:''}
    ${rows.length? `<ol class="ledger">${rows.map(r=>`
      <li>
        <button class="card" type="button" data-set="${r.s.n}" aria-label="${esc(r.s.title)}" style="display:block">${thumbSrc(r.s)?`<div class="mini"><img src="${thumbSrc(r.s)}" alt="" loading="lazy" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.src.replace('maxresdefault','hqdefault')}"></div>`:`<div class="mini" style="background:${TONES[r.s.n%4]}"><span>${r.s.n}</span></div>`}</button>
        <div class="t">
          <span class="song">${hl(r.song, raw)}</span>${r.artist?` <span class="art">— ${hl(r.artist, raw)}</span>`:''}
          <span class="from">No.${EP.get(r.s.n)} <button class="linkish" type="button" data-set="${r.s.n}">${esc(r.s.name||r.s.title)}</button> · ${fmtDate(r.s.date)}</span>
        </div>
        ${tsLink(r.s,r.ts)}
      </li>`).join('')}</ol>` : `<div class="empty">${stImg("chameleon",0,false)}<p>${T("empty")}</p></div>`}`;
}

function render(){
  const has = state.q.trim().length>0;
  $('grid').hidden = has; $('freqSec').hidden = has; $('results').hidden = !has; $('clear').hidden = !has;
  has ? (renderResults(), watchPops()) : renderGrid();
}

function openSet(n){
  const s = SETS.find(x=>x.n===+n); if(!s) return;
  const src = thumbSrc(s);
  const yt = s.yt ? `https://www.youtube.com/watch?v=${s.yt}`
    : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`Yawaraka Jazz "${s.title}" ${s.sub}`);
  $('dlg').innerHTML = `
    <div class="dhero" style="background:${TONES[s.n%4]}">${src?`<img src="${src}" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=this.src.replace('maxresdefault','hqdefault')}">`:`<div class="blank"><i></i></div>`}
      <button class="dclose" type="button" aria-label="close" data-close>×</button></div>
    <div class="dbody">
      <div class="kick">No.${EP.get(s.n)} · ${fmtDate(s.date)} · ${s.min}min</div>
      <h2>${esc(s.name||s.title)}</h2>
      <p class="sub">${esc(s.title)} // ${esc(s.sub)}</p>
      ${s.note?`<p class="note">${esc(s.note[LANG]||s.note.en)}</p>`:''}
      <ol class="tl">${s.tracks.map(([ts,song,artist])=>`
        <li>${tsLink(s,ts)}<div><span class="song">${esc(song)}</span>
        ${artist?`<span class="art">${people(artist).length? artist.split(/(\s*(?:,|&|\/|\band\b|\bwith\b|\bfeat\.|\bft\.|\bfeaturing\b)\s*)/i).map(part=>/^\s*(?:,|&|\/|and|with|feat\.|ft\.|featuring)\s*$/i.test(part)||!part.trim()?esc(part):`<button class="linkish" type="button" data-q="${esc(part.trim())}">${esc(part)}</button>`).join(''):esc(artist)}</span>`:''}</div></li>`).join('')}</ol>
      <a class="yt" href="${yt}" target="_blank" rel="noopener">${s.yt?T("watch"):T("yt")} ↗</a>
    </div>`;
  $('dlg').dataset.n = s.n;
  if(!$('dlg').open) $('dlg').showModal();
  $('dlg').scrollTop = 0;
}

document.addEventListener('click', e=>{
  const q = e.target.closest('[data-q]');
  if(q){ e.preventDefault(); if($('dlg').open) $('dlg').close(); state.q = q.dataset.q; setScope(q.dataset.scope||'all'); $('q').value = state.q; render(); window.scrollTo({top:0}); return; }
  const c = e.target.closest('[data-close]'); if(c){ $('dlg').close(); return; }
  const s = e.target.closest('[data-set]'); if(s){ openSet(s.dataset.set); return; }
});
$('dlg').addEventListener('click', e=>{ if(e.target===$('dlg')) $('dlg').close(); });
$('q').addEventListener('input', e=>{ state.q = e.target.value; render(); });
$('clear').addEventListener('click', ()=>{ state.q=''; $('q').value=''; render(); $('q').focus(); });
$('lang').addEventListener('click', e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  LANG=b.dataset.v; try{localStorage.setItem('yjc-lang',LANG)}catch(err){}
  applyLang(); renderRanks(); render(); if($('dlg').open && $('dlg').dataset.n) openSet($('dlg').dataset.n);
});
for (const id of ['scope','sort']) $(id).addEventListener('click', e=>{
  const b = e.target.closest('button[data-v]'); if(!b) return;
  state[id] = b.dataset.v;
  $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  render();
});
document.querySelectorAll('img[data-st]').forEach(el=>el.src=STICKERS[el.dataset.st]);
function setScope(v){ state.scope=v; $('scope').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===v)); }
$('moreA').addEventListener('click',()=>{ open.A=!open.A; renderRanks(); });
$('moreS').addEventListener('click',()=>{ open.S=!open.S; renderRanks(); });
applyLang();
renderRanks();
render();
watchPops();
</script>

</body>
</html>
